```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🚀 Space Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        #menu {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #263238, #080808);
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        #subtitulo {
            color: #aaa;
            margin-bottom: 30px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            margin: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #googleBtn {
            background: white;
            color: #222;
        }

        #googleBtn:hover {
            background: #eee;
        }

        #jugarBtn {
            background: #4caf50;
            color: white;
        }

        #salirBtn {
            background: #e53935;
            color: white;
        }

        #estado {
            margin-top: 20px;
            min-height: 25px;
            color: #ccc;
        }

        #usuario {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            width: 320px;
        }

        #fotoUsuario {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        #juego {
            display: none;
            min-height: 100vh;
            padding: 30px;
            background:
                linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                radial-gradient(circle, #263238, #050505);
        }

        #juego h2 {
            font-size: 35px;
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- MENÚ PRINCIPAL -->
    <!-- ========================= -->

    <div id="menu">

        <h1>🚀 SPACE GAME</h1>

        <p id="subtitulo">
            Juego de tripulación espacial
        </p>

        <!-- Botón de Google -->
        <button id="googleBtn">
            🔵 Iniciar sesión con Google
        </button>

        <!-- Información del usuario -->
        <div id="usuario">

            <img id="fotoUsuario" src="" alt="Foto">

            <h2 id="nombreUsuario">
                Jugador
            </h2>

            <p id="correoUsuario">
                correo
            </p>

            <button id="jugarBtn">
                ▶️ JUGAR
            </button>

            <button id="salirBtn">
                🚪 CERRAR SESIÓN
            </button>

        </div>

        <p id="estado"></p>

    </div>


    <!-- ========================= -->
    <!-- JUEGO -->
    <!-- ========================= -->

    <div id="juego">

        <h2>🚀 ¡Bienvenido a la nave!</h2>

        <p id="mensajeJuego">
            Aquí empezaremos a construir el mapa.
        </p>

        <button id="volverBtn">
            ↩️ Volver al menú
        </button>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script type="module" src="script.js"></script>

</body>
</html>
